[project]
name = "dot-agent"
version = "2.0.0-dev"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.0",
    "typer>=0.16.0",
    "rich>=13.7.0",
    "mcp>=1.0",
    "prompt_toolkit>=3.0.43",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "textual>=8.0",
    "langchain>=1.4.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-huggingface>=1.2.2",
    "sentence-transformers>=6.0.1",
    "langchain-community>=0.4.2",
    "pymilvus[milvus-lite]>=3.0.1",
    "langchain-chroma>=1.1.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "python-multipart>=0.0.32",
    "pypdf>=6.17.0",
    "docx2txt>=0.9",
    "pymupdf4llm>=1.28.2",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
]

[project.scripts]
agent = "dot.coding.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dot"]
