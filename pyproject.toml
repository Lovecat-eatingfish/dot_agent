[project]
name = "dot-agent"
version = "2.0.0-dev"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.0",
    "typer>=0.16.0",
    "rich>=13.7.0",
    "mcp>=1.0",
    "prompt_toolkit>=3.0.43",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
agent     = "dot.coding.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"src/dot" = "dot"
