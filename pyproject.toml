[project]
name = "mokioclaw"
version = "0.1.0"
description = "A teaching-first mini CodeAgent built from ToolCall to Claw."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.2.15",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.1.13",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.1.6",
    "pillow>=11.0.0",
    "pypdf>=6.16.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "tavily-python>=0.7.24",
    "textual>=8.2.4",
    "typer>=0.16.0",
    "uvicorn>=0.52.3",
]

[project.scripts]
dotagent  = "mokioclaw.interaction.app:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"src/mokioclaw/plugins/builtin" = "mokioclaw/plugins/builtin"
